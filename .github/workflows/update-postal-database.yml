name: Update Postal Database

on:
  # 手動觸發
  workflow_dispatch:

  # 每季 2 日自動執行（1/2, 4/2, 7/2, 10/2 UTC 00:00，台灣時間 08:00）
  # 配合中華郵政每季更新資料的時程
  schedule:
    - cron: '0 0 2 1,4,7,10 *'

jobs:
  update-postal-data:
    name: Generate PostalData.g.cs from DBF
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Download rall1.dbf from Postal Service
        id: download
        shell: pwsh
        run: |
          Write-Host "開始下載郵遞區號資料庫..." -ForegroundColor Cyan
          .\tools\postal\Download-PostalDatabase.ps1 -ErrorAction Stop

          if (Test-Path "temp\rall1.dbf") {
            $fileInfo = Get-Item "temp\rall1.dbf"
            $fileSizeMB = [math]::Round($fileInfo.Length / 1MB, 2)
            $fileDate = $fileInfo.LastWriteTime.ToString("yyyy-MM-dd")
            $fileHash = (Get-FileHash "temp\rall1.dbf" -Algorithm SHA256).Hash.ToLower()

            echo "file_size=$fileSizeMB MB" >> $env:GITHUB_OUTPUT
            echo "file_date=$fileDate" >> $env:GITHUB_OUTPUT
            echo "file_sha256=$fileHash" >> $env:GITHUB_OUTPUT
            echo "success=true" >> $env:GITHUB_OUTPUT
          } else {
            Write-Error "下載失敗：找不到 rall1.dbf"
            exit 1
          }

      - name: Run codegen to generate PostalData.g.cs
        id: codegen
        shell: pwsh
        run: |
          Write-Host "開始產生 PostalData.g.cs..." -ForegroundColor Cyan
          dotnet run --project tools/postal/Postal.Builder/ --framework net10.0 -- codegen `
            temp\rall1.dbf `
            src\TaiwanUtilities\Postal\PostalData.g.cs

          if ($LASTEXITCODE -ne 0) {
            Write-Error "codegen 失敗"
            exit 1
          }

          $outFile = "src\TaiwanUtilities\Postal\PostalData.g.cs"
          if (Test-Path $outFile) {
            $lines = (Get-Content $outFile).Count
            echo "line_count=$lines" >> $env:GITHUB_OUTPUT
            echo "success=true" >> $env:GITHUB_OUTPUT
            Write-Host "產生完成：$lines 行" -ForegroundColor Green
          } else {
            Write-Error "codegen 失敗：找不到 PostalData.g.cs"
            exit 1
          }

      - name: Verify build with generated data
        shell: pwsh
        run: |
          Write-Host "驗證建置..." -ForegroundColor Cyan
          dotnet build src/TaiwanUtilities/ --configuration Release
          if ($LASTEXITCODE -ne 0) {
            Write-Error "建置驗證失敗"
            exit 1
          }
          Write-Host "建置驗證成功" -ForegroundColor Green

      - name: Commit and push PostalData.g.cs
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $fileDate = "${{ steps.download.outputs.file_date }}"
          $lineCount = "${{ steps.codegen.outputs.line_count }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add src/TaiwanUtilities/Postal/PostalData.g.cs

          $status = git status --porcelain
          if ($status) {
            git commit -m "chore(postal): update PostalData.g.cs from $fileDate DBF ($lineCount lines)"
            git push
            Write-Host "已提交並推送 PostalData.g.cs" -ForegroundColor Green
          } else {
            Write-Host "PostalData.g.cs 無變更，略過提交" -ForegroundColor Yellow
          }
