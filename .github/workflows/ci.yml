name: CI/CD

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Install T4 Text Template Tool
      run: dotnet tool install -g dotnet-t4

    - name: Restore dependencies
      run: dotnet restore

    - name: Generate holiday data
      run: t4 ${{ github.workspace }}/src/TaiwanUtilities/RocDateTime/RocHolidayDataSet.tt

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      shell: bash
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --filter "FullyQualifiedName!~Generate_10000Addresses"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'

  # 只有「會改變已發佈 nupkg」的變動才發版。準則：進 nupkg 或直接定義套件內容/版號者觸發。
  #   觸發：src/（程式碼 + PostalData.g.cs）、data/（假日 CSV 經 T4 嵌入）、
  #         Directory.Build.props（版號/建置設定）、README.md 與 LICENSE（Pack=true，實體打入 nupkg）
  #   不觸發：docs/、test/、tools/、.github/、global.json 等建置環境或未隨套件出貨的檔案
  changes:
    name: Detect shippable changes
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      publish: ${{ steps.filter.outputs.publish }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Check changed paths
      id: filter
      shell: bash
      run: |
        BEFORE="${{ github.event.before }}"
        AFTER="${{ github.sha }}"
        ZERO="0000000000000000000000000000000000000000"
        PATTERN='^(src|data)/|^directory\.build\.props$|^readme\.md$|^license$'
        if [ -z "$BEFORE" ] || [ "$BEFORE" = "$ZERO" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "無法解析推送前 SHA（首推/強推），保守發佈"
        elif git diff --name-only "$BEFORE" "$AFTER" | grep -qiE "$PATTERN"; then
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "有影響套件內容的變動 → 發佈"
        else
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "僅 docs/test/tools/meta 變更 → 略過發佈"
        fi

  pack-and-publish:
    name: Pack and Publish
    runs-on: ubuntu-latest
    needs: [build-and-test, changes]
    if: needs.changes.outputs.publish == 'true'
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Install T4 Text Template Tool
      run: dotnet tool install -g dotnet-t4

    - name: Restore dependencies
      run: dotnet restore

    - name: Generate holiday data
      run: t4 ${{ github.workspace }}/src/TaiwanUtilities/RocDateTime/RocHolidayDataSet.tt

    # 版號 = <VersionPrefix>.<yyyyMMdd><NN>
    #   major.minor: 取自 Directory.Build.props 的 VersionPrefix（人為控管）
    #   patch: 台北日期 yyyyMMdd × 100 + 當日第 NN 次發佈（NN 兩位 00-99）
    #   整數運算避免字串串接亂序；yyyyMMdd*100+99 撐到 2148 年不溢位 Int32
    - name: Compute version
      id: version
      shell: bash
      run: |
        MAJOR_MINOR=$(sed -n 's|.*<VersionPrefix>\(.*\)</VersionPrefix>.*|\1|p' Directory.Build.props | head -1)
        DAY=$(TZ='Asia/Taipei' date +%Y%m%d)
        SINCE="$(TZ='Asia/Taipei' date +%Y-%m-%d)T00:00:00+08:00"
        COUNT=$(git log "$GITHUB_SHA" --since="$SINCE" --pretty=oneline | wc -l | tr -d ' ')
        NN=$((COUNT - 1))
        if [ "$NN" -lt 0 ]; then NN=0; fi
        if [ "$NN" -gt 99 ]; then NN=99; fi
        PATCH=$((10#$DAY * 100 + NN))
        VERSION="${MAJOR_MINOR}.${PATCH}"
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "Computed version: $VERSION (day=$DAY, todays commits=$COUNT, NN=$NN)"

    # 只覆寫 PackageVersion（NuGet 版號允許 Int32 patch）；AssemblyVersion/FileVersion
    # 維持 VersionPrefix 衍生的 2.0.0.0（各段 UInt16 上限 65535，日期數字會溢位，故不能動）
    - name: Pack NuGet package
      run: dotnet pack src/TaiwanUtilities/TaiwanUtilities.csproj --configuration Release -p:PackageVersion=${{ steps.version.outputs.version }} --output ./nupkg

    - name: Publish NuGet package
      run: dotnet nuget push ./nupkg/TaiwanUtilities.*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    # 同一天、同 major.minor 的舊版本 unlist，只保留剛發佈的最新版（保持 NuGet 頁面整潔）。
    # 只比對 <major.minor>.<yyyyMMdd> 前綴：不同日期、不同 major.minor 的版本不動。
    # unlist 為可逆（可重新 list），單筆失敗不讓整個 job 掛掉。
    - name: Unlist older same-day versions
      shell: bash
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        PREFIX="$(echo "$VERSION" | sed 's/..$//')"   # 去掉 NN 兩位 → <major.minor>.<yyyyMMdd>
        echo "keep: $VERSION ; unlist prefix: ${PREFIX}NN"
        VERSIONS=$(curl -s https://api.nuget.org/v3-flatcontainer/taiwanutilities/index.json | jq -r '.versions[]?' || true)
        for v in $VERSIONS; do
          case "$v" in
            "$PREFIX"*)
              if [ "$v" != "$VERSION" ]; then
                echo "unlisting $v"
                dotnet nuget delete TaiwanUtilities "$v" \
                  --source https://api.nuget.org/v3/index.json \
                  --api-key ${{ secrets.NUGET_API_KEY }} \
                  --non-interactive || echo "  (unlist failed for $v, continuing)"
              fi
              ;;
          esac
        done

    - name: Update package-latest release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        NUPKG=$(ls ./nupkg/*.nupkg | head -1)
        RELEASE_BODY="最新 TaiwanUtilities 套件 v${VERSION}（commit ${GITHUB_SHA:0:7}，建置 $(date -u '+%Y-%m-%d %H:%M') UTC）。

        安裝：\`dotnet add package TaiwanUtilities --version ${VERSION}\`"

        # 滾動式 package-latest release（供手動下載 .nupkg）；每次發佈覆寫
        gh release delete package-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
        gh release create package-latest \
          --repo "$GITHUB_REPOSITORY" \
          --title "NuGet Package (v${VERSION})" \
          --notes "$RELEASE_BODY" \
          --latest=false \
          "$NUPKG"

  codeql:
    name: CodeQL Security Analysis
    runs-on: ubuntu-latest
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    permissions:
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: csharp

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.x

      - name: Install T4 Text Template Tool
        run: dotnet tool install -g dotnet-t4

      - name: Generate holiday data
        run: t4 ${{ github.workspace }}/src/TaiwanUtilities/RocDateTime/RocHolidayDataSet.tt

      - name: Build
        run: dotnet build --configuration Release

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
