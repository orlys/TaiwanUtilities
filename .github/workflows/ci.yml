name: CI/CD

on:
  push:
    paths-ignore:
      - '**.md'
      - 'data/holidays/**'
    branches:
      - main
      - dev
    tags:
      - 'v*'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - main

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download postal database from GitHub Release
      shell: bash
      run: |
        echo "Downloading zipcode.db from GitHub Release..."
        mkdir -p src/TaiwanUtilities/Postal

        gh release download database-latest \
          --pattern "zipcode.db" \
          --dir src/TaiwanUtilities/Postal \
          --repo ${{ github.repository }} \
          --clobber || echo "::warning::Failed to download database from Release. Build will attempt alternative download methods."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Install T4 Text Template Tool
      run: dotnet tool install -g dotnet-t4

    - name: Restore dependencies
      run: dotnet restore

    - name: Generate holiday data
      run: t4 ${{ github.workspace }}/src/TaiwanUtilities/RocDateTime/RocHolidays.tt

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      shell: bash
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --filter "FullyQualifiedName!~Generate_10000Addresses"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'

  pack-and-publish:
    name: Pack and Publish
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download postal database from GitHub Release
      shell: bash
      run: |
        echo "Downloading zipcode.db from GitHub Release..."
        mkdir -p src/TaiwanUtilities/Postal

        gh release download database-latest \
          --pattern "zipcode.db" \
          --dir src/TaiwanUtilities/Postal \
          --repo ${{ github.repository }} \
          --clobber || echo "::warning::Failed to download database from Release. Build will attempt alternative download methods."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Install T4 Text Template Tool
      run: dotnet tool install -g dotnet-t4

    - name: Restore dependencies
      run: dotnet restore

    - name: Generate holiday data
      run: t4 ${{ github.workspace }}/src/TaiwanUtilities/RocDateTime/RocHolidays.tt

    - name: Pack NuGet package
      run: dotnet pack src/TaiwanUtilities/TaiwanUtilities.csproj --configuration Release --output ./nupkg

    - name: Publish NuGet package
      run: dotnet nuget push ./nupkg/TaiwanUtilities.*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

    - name: Upload to GitHub Release
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        NUPKG=$(ls ./nupkg/*.nupkg | head -1)
        NUPKG_NAME=$(basename "$NUPKG")
        COMMIT_SHA="${GITHUB_SHA:0:7}"

        RELEASE_TAG="package-latest"
        RELEASE_TITLE="NuGet Package (v${VERSION})"
        RELEASE_BODY="## 📦 最新 NuGet 套件

        此 Release 包含最新建置的 TaiwanUtilities NuGet 套件。

        ### 📊 套件資訊

        - **版本**: ${VERSION}
        - **建置時間**: $(date -u '+%Y-%m-%d %H:%M:%S') UTC
        - **Commit**: ${GITHUB_SHA}

        ### 📥 安裝方式

        \`\`\`bash
        dotnet add package TaiwanUtilities --version ${VERSION}
        \`\`\`

        或手動下載 .nupkg 檔案：
        \`\`\`bash
        gh release download package-latest --pattern \"*.nupkg\" --repo ${{ github.repository }}
        \`\`\`

        ---

        🤖 由 GitHub Actions 自動更新"

        # 刪除舊 release（如果存在）
        gh release delete "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
        git push --delete origin "$RELEASE_TAG" 2>/dev/null || true

        # 建立新 release
        gh release create "$RELEASE_TAG" \
          --repo "$GITHUB_REPOSITORY" \
          --title "$RELEASE_TITLE" \
          --notes "$RELEASE_BODY" \
          --latest=false \
          "$NUPKG"

        # 同時建立版本 tag 的正式 release
        gh release create "${GITHUB_REF_NAME}" \
          --repo "$GITHUB_REPOSITORY" \
          --title "v${VERSION}" \
          --generate-notes \
          "$NUPKG" 2>/dev/null || true
