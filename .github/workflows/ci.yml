name: CI/CD

on:
  push:
    paths-ignore:
      - '**.md'
      - 'data/holidays/**'
    branches:
      - master
      - dev
    tags:
      - 'v*'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - master

jobs:
  build-and-test:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download postal database from GitHub Release
      shell: bash
      run: |
        echo "Downloading zipcode.db from GitHub Release..."
        mkdir -p src/TaiwanUtilities/Postal

        gh release download database-latest \
          --pattern "zipcode.db" \
          --dir src/TaiwanUtilities/Postal \
          --repo ${{ github.repository }} \
          --clobber || echo "::warning::Failed to download database from Release. Build will attempt alternative download methods."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Install T4 Text Template Tool
      run: dotnet tool install -g dotnet-t4

    - name: Restore dependencies
      run: dotnet restore

    - name: Generate holiday data
      run: t4 ${{ github.workspace }}/src/TaiwanUtilities/RocDateTime/RocDateTime.Holidays.tt

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      shell: bash
      run: |
        dotnet test \
          --configuration Release \
          --no-build \
          --verbosity normal \
          --logger "trx;LogFileName=test-results.trx" \
          --filter "FullyQualifiedName!~Generate_10000Addresses"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results-${{ matrix.os }}
        path: '**/test-results.trx'

  pack-and-publish:
    name: Pack and Publish
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))

    steps:
    - uses: actions/checkout@v4

    - name: Download postal database from GitHub Release
      shell: bash
      run: |
        echo "Downloading zipcode.db from GitHub Release..."
        mkdir -p src/TaiwanUtilities/Postal

        gh release download database-latest \
          --pattern "zipcode.db" \
          --dir src/TaiwanUtilities/Postal \
          --repo ${{ github.repository }} \
          --clobber || echo "::warning::Failed to download database from Release. Build will attempt alternative download methods."
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.x

    - name: Install T4 Text Template Tool
      run: dotnet tool install -g dotnet-t4

    - name: Restore dependencies
      run: dotnet restore

    - name: Generate holiday data
      run: t4 ${{ github.workspace }}/src/TaiwanUtilities/RocDateTime/RocDateTime.Holidays.tt

    - name: Pack NuGet package
      run: dotnet pack --configuration Release --output ./nupkg

    - name: Publish NuGet package
      run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
